[project]
name = "memtrace-api"
version = "0.1.1"
description = "MemTrace Day 1 FastAPI service"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's declarative ``Depends``-in-default pattern is idiomatic; ``Path``,
# ``Query``, and ``Header`` are already exempted by ruff's built-in whitelist.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
